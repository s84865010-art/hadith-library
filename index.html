
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075b46">
<title>নূর ইসলামিক | হাদিস অনুসন্ধান</title>
<style>
:root {
  --green: #075b46;
  --green2: #0b7659;
  --bg: #f5f7f4;
  --card: #ffffff;
  --text: #17251f;
  --muted: #64736b;
  --border: #dce5df;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, "Noto Sans Bengali", sans-serif;
  line-height: 1.7;
}
header {
  background: var(--green);
  color: white;
  padding: 17px 15px;
}
.header-inner {
  max-width: 900px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.brand { font-size: 22px; font-weight: 800; }
.tagline { font-size: 12px; opacity: .85; }
button, select, input { font: inherit; }
button { cursor: pointer; }
.home-btn {
  background: white;
  color: var(--green);
  border: 0;
  padding: 8px 13px;
  border-radius: 9px;
  font-weight: 700;
}
main {
  width: min(900px, 100%);
  margin: auto;
  padding: 17px 13px 40px;
}
.search-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 17px;
  box-shadow: 0 3px 15px #12332208;
}
h1 { font-size: 23px; margin: 0 0 5px; }
h2 { font-size: 21px; margin: 0 0 13px; }
h3 { font-size: 17px; margin: 0; }
.muted { color: var(--muted); font-size: 13px; }
.field { margin-top: 13px; }
label {
  display: block;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 5px;
}
input, select {
  width: 100%;
  min-height: 47px;
  padding: 10px 12px;
  background: white;
  border: 1px solid #cbd8d0;
  border-radius: 10px;
  color: var(--text);
}
.primary {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 10px;
  background: var(--green);
  color: white;
  padding: 12px;
  margin-top: 12px;
  font-weight: 750;
}
.primary:active { background: var(--green2); }
.section-title {
  margin: 24px 2px 12px;
  font-size: 19px;
}
.book-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.book-card, .chapter-card {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 14px 12px;
  color: var(--text);
}
.book-card:active, .chapter-card:active {
  border-color: var(--green);
  background: #edf7f1;
}
.book-icon {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: #e3f1e8;
  color: var(--green);
  font-size: 20px;
}
.card-title { font-weight: 750; font-size: 14px; }
.card-sub { font-size: 12px; color: var(--muted); }
.arrow { margin-left: auto; color: var(--muted); }
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin: 4px 0 17px;
}
.back-btn {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 7px 11px;
  background: white;
  color: var(--green);
  white-space: nowrap;
}
.list { display: grid; gap: 9px; }
.chapter-card { min-height: 67px; }
.chapter-number {
  background: #e3f1e8;
  color: var(--green);
  min-width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  font-weight: 800;
}
.hadith-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  scroll-margin-top: 12px;
}
.hadith-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
  margin-bottom: 13px;
}
.hadith-number { font-weight: 800; color: var(--green); }
.small-btn {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  padding: 6px 9px;
  font-size: 12px;
}
.arabic {
  font-family: "Noto Naskh Arabic", "Traditional Arabic", serif;
  font-size: 25px;
  line-height: 2.1;
  text-align: right;
  direction: rtl;
  margin: 10px 0 15px;
  white-space: pre-wrap;
}
.english {
  color: #394940;
  font-size: 14px;
  white-space: pre-wrap;
}
.narrator { font-weight: 700; }
.notice {
  background: #fff9e9;
  border: 1px solid #ead9a8;
  border-radius: 10px;
  padding: 12px;
  color: #66501c;
  font-size: 13px;
  margin: 12px 0;
}
.status {
  padding: 22px 12px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  text-align: center;
  color: var(--muted);
}
footer {
  text-align: center;
  padding: 22px 10px;
  font-size: 12px;
  color: var(--muted);
}
.hidden { display: none !important; }
@media (min-width: 650px) {
  .book-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  main { padding-top: 25px; }
  .search-panel { padding: 23px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand">নূর ইসলামিক</div>
      <div class="tagline">হাদিস খুঁজুন, পড়ুন ও সংরক্ষণ করুন</div>
    </div>
    <button class="home-btn" onclick="goHome()">হোম পেজ</button>
  </div>
</header>

<main>
  <section id="home">
    <div class="search-panel">
      <h1>হাদিস অনুসন্ধান</h1>
      <div class="muted">
        কিতাব নির্বাচন করে হাদিস নম্বর লিখুন।
      </div>

      <form id="searchForm">
        <div class="field">
          <label for="bookSelect">১. কিতাব নির্বাচন করুন</label>
          <select id="bookSelect" required>
            <option value="">একটি কিতাব বেছে নিন</option>
          </select>
        </div>

        <div class="field">
          <label for="hadithNumber">২. হাদিস নম্বর লিখুন</label>
          <input
            id="hadithNumber"
            type="number"
            min="1"
            step="1"
            placeholder="যেমন: ১"
            required
          >
        </div>

        <button class="primary" type="submit">প্রবেশ করুন</button>
      </form>
    </div>

    <h2 class="section-title">নয়টি হাদিসের কিতাব</h2>
    <div id="bookGrid" class="book-grid"></div>
  </section>

  <section id="bookPage" class="hidden">
    <div class="page-head">
      <div>
        <h2 id="bookTitle"></h2>
        <div id="bookInfo" class="muted"></div>
      </div>
      <button class="back-btn" onclick="goHome()">← ফিরে যান</button>
    </div>
    <div class="notice">
      অধ্যায়গুলো মূল ডেটার অধ্যায় নম্বর দিয়ে দেখানো হচ্ছে।
      অধ্যায়ের আসল নাম দেখাতে অধ্যায়-পরিচিতির ডেটাও প্রয়োজন।
    </div>
    <div id="chapterList" class="list"></div>
  </section>

  <section id="chapterPage" class="hidden">
    <div class="page-head">
      <div>
        <h2 id="chapterTitle"></h2>
        <div id="chapterInfo" class="muted"></div>
      </div>
      <button class="back-btn" onclick="goBackToBook()">← অধ্যায়সমূহ</button>
    </div>
    <div id="hadithList"></div>
  </section>

  <section id="hadithPage" class="hidden">
    <div class="page-head">
      <div>
        <h2 id="singleHadithTitle">হাদিস</h2>
        <div id="singleHadithInfo" class="muted"></div>
      </div>
      <button class="back-btn" onclick="goHome()">হোম পেজ</button>
    </div>
    <div id="singleHadith"></div>
  </section>

  <div id="globalStatus" class="status hidden"></div>
</main>

<footer>
  নূর ইসলামিক · ডেটার উৎস ও সীমাবদ্ধতা যাচাই করে ব্যবহার করুন।
</footer>

<script>
const BOOKS = [
  { id: "bukhari", name: "সহিহ বুখারি", file: "bukhari.json" },
  { id: "muslim", name: "সহিহ মুসলিম", file: "muslim.json" },
  { id: "abu-dawud", name: "সুনান আবু দাউদ", file: "abu-dawud.json" },
  { id: "tirmidhi", name: "জামে তিরমিজি", file: "tirmidhi.json" },
  { id: "nasai", name: "সুনান নাসাঈ", file: "nasai.json" },
  { id: "ibn-majah", name: "সুনান ইবনে মাজাহ", file: "ibn-majah.json" },
  { id: "muwatta", name: "মুয়াত্তা ইমাম মালিক", file: "muwatta.json" },
  { id: "musnad-ahmad", name: "মুসনাদ আহমাদ", file: "musnad-ahmad.json" },
  { id: "darimi", name: "সুনান দারিমি", file: "darimi.json" }
];

const $ = id => document.getElementById(id);
const cache = {};
let currentBook = null;
let currentChapter = null;
let currentHadith = null;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function bookById(id) {
  return BOOKS.find(book => book.id === id);
}

function getRecords(data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.hadiths)) return data.hadiths;
  if (data && Array.isArray(data.records)) return data.records;
  return [];
}

function hadithNumber(h) {
  return Number(h.idInBook ?? h.id ?? h.number ?? h.hadithNumber);
}

function chapterNumber(h) {
  return Number(h.chapterId ?? h.chapter_id ?? h.chapter ?? 0);
}

function arabicText(h) {
  return h.arabic ?? h.arabicText ?? h.textArabic ?? "";
}

function englishNarrator(h) {
  if (typeof h.english === "object" && h.english) {
    return h.english.narrator ?? "";
  }
  return h.narrator ?? "";
}

function englishText(h) {
  if (typeof h.english === "object" && h.english) {
    return h.english.text ?? "";
  }
  return h.english ?? h.translation ?? "";
}

async function loadBook(book) {
  if (cache[book.id]) return cache[book.id];

  const response = await fetch("./data/" + book.file);
  if (!response.ok) {
    throw new Error(
      book.name + " ডেটা পাওয়া যায়নি: data/" + book.file
    );
  }

  const data = await response.json();
  const records = getRecords(data);

  if (!records.length) {
    throw new Error(
      book.name + " JSON-এ প্রত্যাশিত hadiths তালিকা নেই।"
    );
  }

  records.sort((a, b) => hadithNumber(a) - hadithNumber(b));
  cache[book.id] = records;
  return records;
}

function showSection(id) {
  ["home", "bookPage", "chapterPage", "hadithPage", "globalStatus"]
    .forEach(section => $(section).classList.add("hidden"));
  $(id).classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "instant" });
}

function showStatus(message) {
  $("globalStatus").textContent = message;
  showSection("globalStatus");
}

function fillBookSelectors() {
  const select = $("bookSelect");

  BOOKS.forEach(book => {
    const option = document.createElement("option");
    option.value = book.id;
    option.textContent = book.name;
    select.appendChild(option);
  });

  $("bookGrid").innerHTML = BOOKS.map(book => `
    <button class="book-card" data-book="${book.id}">
      <span class="book-icon">📚</span>
      <span>
        <span class="card-title">${escapeHTML(book.name)}</span>
        <span class="card-sub" style="display:block">অধ্যায়সমূহ দেখুন</span>
      </span>
      <span class="arrow">›</span>
    </button>
  `).join("");

  $("bookGrid").querySelectorAll("[data-book]").forEach(button => {
    button.addEventListener("click", () => openBook(button.dataset.book));
  });
}

function goHome() {
  location.hash = "";
  currentBook = currentChapter = currentHadith = null;
  showSection("home");
}

function goBackToBook() {
  if (currentBook) openBook(currentBook.id);
  else goHome();
}

async function openBook(bookId) {
  const book = bookById(bookId);
  if (!book) return goHome();

  currentBook = book;
  location.hash = "book/" + book.id;
  showStatus("কিতাবের অধ্যায়গুলো লোড হচ্ছে...");

  try {
    const records = await loadBook(book);
    const groups = new Map();

    records.forEach(h => {
      const chapter = chapterNumber(h);
      if (!groups.has(chapter)) groups.set(chapter, []);
      groups.get(chapter).push(h);
    });

    $("bookTitle").textContent = book.name;
    $("bookInfo").textContent =
      "ডেটায় পাওয়া হাদিস: " + records.length.toLocaleString("bn-BD");

    $("chapterList").innerHTML = [...groups.entries()]
      .sort((a, b) => a[0] - b[0])
      .map(([chapter, hadiths]) => `
        <button class="chapter-card"
          data-chapter="${chapter}">
          <span class="chapter-number">${chapter.toLocaleString("bn-BD")}</span>
          <span>
            <span class="card-title">অধ্যায় ${chapter.toLocaleString("bn-BD")}</span>
            <span class="card-sub" style="display:block">
              ${hadiths.length.toLocaleString("bn-BD")}টি হাদিস
            </span>
          </span>
          <span class="arrow">›</span>
        </button>
      `).join("");

    $("chapterList").querySelectorAll("[data-chapter]").forEach(button => {
      button.addEventListener("click", () =>
        openChapter(book.id, Number(button.dataset.chapter))
      );
    });

    showSection("bookPage");
  } catch (error) {
    showStatus(error.message);
  }
}

function renderHadithCard(h, book) {
  const number = hadithNumber(h);
  const chapter = chapterNumber(h);
  const arabic = arabicText(h);
  const narrator = englishNarrator(h);
  const english = englishText(h);

  return `
    <article class="hadith-card" id="hadith-${number}">
      <div class="hadith-top">
        <span class="hadith-number">
          হাদিস নং ${Number(number).toLocaleString("bn-BD")}
        </span>
        <button class="small-btn"
          data-direct="${number}"
          data-book="${book.id}">
          বিস্তারিত
        </button>
      </div>
      ${arabic ? `<div class="arabic" lang="ar" dir="rtl">${escapeHTML(arabic)}</div>` : ""}
      ${narrator ? `<div class="english narrator">${escapeHTML(narrator)}</div>` : ""}
      ${english ? `<div class="english">${escapeHTML(english)}</div>` : ""}
      ${!arabic && !english ? `<div class="muted">এই রেকর্ডে পাঠ পাওয়া যায়নি।</div>` : ""}
      <div class="muted" style="margin-top:12px">
        ${escapeHTML(book.name)} · অধ্যায় ${chapter.toLocaleString("bn-BD")}
      </div>
    </article>
  `;
}

function wireHadithButtons(root) {
  root.querySelectorAll("[data-direct]").forEach(button => {
    button.addEventListener("click", () =>
      openHadith(button.dataset.book, Number(button.dataset.direct))
    );
  });
}

async function openChapter(bookId, chapterId) {
  const book = bookById(bookId);
  if (!book) return goHome();

  currentBook = book;
  currentChapter = chapterId;
  location.hash = "chapter/" + book.id + "/" + chapterId;
  showStatus("অধ্যায়ের হাদিসগুলো লোড হচ্ছে...");

  try {
    const records = await loadBook(book);
    const selected = records.filter(
      h => chapterNumber(h) === chapterId
    );

    $("chapterTitle").textContent =
      book.name + " — অধ্যায় " + chapterId.toLocaleString("bn-BD");
    $("chapterInfo").textContent =
      selected.length.toLocaleString("bn-BD") + "টি হাদিস";

    if (!selected.length) {
      $("hadithList").innerHTML =
        '<div class="status">এই অধ্যায়ে কোনো হাদিস পাওয়া যায়নি।</div>';
    } else {
      $("hadithList").innerHTML =
        selected.map(h => renderHadithCard(h, book)).join("");
      wireHadithButtons($("hadithList"));
    }

    showSection("chapterPage");
  } catch (error) {
    showStatus(error.message);
  }
}

async function openHadith(bookId, number) {
  const book = bookById(bookId);
  if (!book || !Number.isInteger(number) || number < 1) {
    showStatus("সঠিক কিতাব ও হাদিস নম্বর নির্বাচন করুন।");
    return;
  }

  showStatus("নির্দিষ্ট হাদিস খোঁজা হচ্ছে...");

  try {
    const records = await loadBook(book);
    const hadith = records.find(h => hadithNumber(h) === number);

    if (!hadith) {
      showStatus(
        book.name + "-এ " + number.toLocaleString("bn-BD") +
        " নম্বর হাদিস পাওয়া যায়নি। নম্বরটি যাচাই করুন।"
      );
      return;
    }

    currentBook = book;
    currentHadith = hadith;
    location.hash = "hadith/" + book.id + "/" + number;

    $("singleHadithTitle").textContent =
      book.name + " — হাদিস " + number.toLocaleString("bn-BD");
    $("singleHadithInfo").textContent =
      "অধ্যায় " + chapterNumber(hadith).toLocaleString("bn-BD");

    $("singleHadith").innerHTML = renderHadithCard(hadith, book);
    wireHadithButtons($("singleHadith"));
    showSection("hadithPage");
  } catch (error) {
    showStatus(error.message);
  }
}

$("searchForm").addEventListener("submit", event => {
  event.preventDefault();

  const bookId = $("bookSelect").value;
  const number = Number($("hadithNumber").value);

  if (!bookId) {
    alert("আগে একটি কিতাব নির্বাচন করুন।");
    return;
  }
  if (!Number.isInteger(number) || number < 1) {
    alert("একটি সঠিক হাদিস নম্বর লিখুন।");
    return;
  }

  openHadith(bookId, number);
});

async function routeFromHash() {
  const route = decodeURIComponent(location.hash.slice(1));
  if (!route) {
    currentBook = currentChapter = currentHadith = null;
    showSection("home");
    return;
  }

  const parts = route.split("/");

  if (parts[0] === "book" && parts[1]) {
    await openBook(parts[1]);
  } else if (
    parts[0] === "chapter" && parts[1] && parts[2]
  ) {
    await openChapter(parts[1], Number(parts[2]));
  } else if (
    parts[0] === "hadith" && parts[1] && parts[2]
  ) {
    await openHadith(parts[1], Number(parts[2]));
  } else {
    showSection("home");
  }
}

fillBookSelectors();
window.addEventListener("hashchange", routeFromHash);
routeFromHash();
</script>
</body>
</html>
